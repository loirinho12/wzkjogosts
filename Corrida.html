<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f1ee;--fg:#1d1d1b;--card:#fff;--bd:#cfcfc8;--ac:#e74c3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--fg:#eee;--card:#222226;--bd:#3a3a40}}
:root[data-theme="dark"]{--bg:#161618;--fg:#eee;--card:#222226;--bd:#3a3a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:12px}
#w{position:relative;width:100%;max-width:900px}
canvas{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--bd);background:#005f00}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px 22px;max-width:92%;text-align:center;box-shadow:0 6px 24px #0005}
h1{margin:0 0 8px;font-size:24px}p{margin:6px 0;font-size:14px}
button{font:inherit;padding:9px 16px;margin:4px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--ac)}
input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);text-align:center}
ol{text-align:left;font-size:14px;margin:6px auto;padding-left:24px;width:fit-content}
#tc{display:none;justify-content:space-between;margin-top:8px}
#tc button{width:30%;padding:16px 0;font-size:20px;touch-action:none;user-select:none}
@media (pointer:coarse){#tc{display:flex}}
</style>
</head>
<body>
<div id="w">
<canvas id="c" width="900" height="560"></canvas>
<div id="ov"></div>
<div id="tc"><button data-k="a">◀</button><button data-k="w">Acelera</button><button data-k="s">Freia</button><button data-k="d">▶</button></div>
</div>
<script>
const CX=450,CY=280,RX=340,RY=200,L=1650,VOLTAS=5,LAT_MAX=70;
const velAI={facil:[150,195],medio:[185,225],dificil:[215,250]};
const NOMES={facil:"Fácil",medio:"Médio",dificil:"Difícil"};
const COR=["#e74c3c","#3498db","#f1c40f","#9b59b6","#e67e22","#1abc9c","#ffffff","#2ecc71"];
const SPR=[".TBBT.","BBWWBH","BBWWBH",".TBBT."];
const PX={B:null,W:"#8cc8ff",T:"#191919",H:"#fff078"};
const cv=document.getElementById("c"),g=cv.getContext("2d"),ov=document.getElementById("ov");
let estado="menu",dif="medio",carros=[],tempo=0,ultCol=0,msg="",msgT=0,colisoes=0,ultras=0,posAnt=7,posFinal=0,pontosFinais=0,aviso="";
const keys={};
const rank=()=>{try{return JSON.parse(localStorage.getItem("corrida_rank")||"[]")}catch(e){return []}};
const textoRank=()=>{const r=rank().slice(0,5);return r.length?"<ol>"+r.map(x=>`<li>${x.nome.replace(/</g,"&lt;")} — ${x.pontos} pts (${NOMES[x.dif]})</li>`).join("")+"</ol>":"<p>Ainda ninguém no ranking.</p>"};

function coord(c){const a=c.prog/L*Math.PI*2;return{x:CX+(RX+c.lat)*Math.cos(a),y:CY+(RY+c.lat)*Math.sin(a)}}
function posicoes(){return[...carros].sort((x,y)=>x.fim&&y.fim?x.fim-y.fim:x.fim?-1:y.fim?1:y.prog-x.prog)}
const posDe=c=>posicoes().indexOf(c)+1;
const pontosAtuais=()=>Math.max(0,ultras*100-colisoes*25);

function iniciar(d){
  dif=d;carros=[];tempo=0;colisoes=0;ultras=0;msg="";aviso="";ultCol=0;
  const[a,b]=velAI[d];
  for(let i=0;i<8;i++){const h=i===6,l=i%2?28:-28;
    carros.push({id:i,nome:h?"Você":"Carro "+(i+1),prog:-i*30,lat:l,vel:0,humano:h,max:h?235:a+Math.random()*(b-a),alvoLat:l,fim:0})}
  posAnt=7;estado="corrida";ov.innerHTML="";
}

function atualizar(dt){
  tempo+=dt;const eu=carros[6];
  for(const c of carros){
    if(c.humano){
      if(!eu.fim){
        if(keys.w||keys.arrowup)c.vel+=130*dt;else if(keys.s||keys.arrowdown)c.vel-=220*dt;else c.vel-=45*dt;
        if(keys.a||keys.arrowleft)c.lat+=90*dt;
        if(keys.d||keys.arrowright)c.lat-=90*dt;
      }else c.vel-=80*dt;
      c.vel=Math.max(0,Math.min(c.max,c.vel));
      c.lat=Math.max(-LAT_MAX,Math.min(LAT_MAX,c.lat));
    }else{
      if(Math.random()<dt*0.6)c.alvoLat=(Math.random()*2-1)*LAT_MAX;
      c.lat+=Math.sign(c.alvoLat-c.lat)*Math.min(Math.abs(c.alvoLat-c.lat),40*dt);
      const alvo=c.max*(0.93+0.07*Math.sin(tempo*0.8+c.id));
      c.vel+=(alvo-c.vel)*Math.min(1,dt*1.5);
    }
    c.prog+=c.vel*dt;
    if(!c.fim&&c.prog>=VOLTAS*L)c.fim=tempo;
  }
  if(!eu.fim&&tempo-ultCol>0.7){
    const pe=coord(eu);
    for(const o of carros){if(o.humano)continue;const po=coord(o);
      if(Math.hypot(pe.x-po.x,pe.y-po.y)<20){
        ultCol=tempo;colisoes++;msg="💥 Você colidiu com o "+o.nome+"!";msgT=1.6;
        eu.vel*=0.45;o.vel*=0.8;eu.lat+=eu.lat>=o.lat?14:-14;break}}
  }
  const p=posDe(eu);if(p<posAnt)ultras+=posAnt-p;posAnt=p;
  if(msgT>0)msgT-=dt;
  if(eu.fim)terminar();
}

function terminar(){
  posFinal=posicoes().indexOf(carros[6])+1;
  pontosFinais=pontosAtuais()+(8-posFinal)*200+Math.max(0,Math.round((150-tempo)*5));
  if(posFinal===1){estado="nome";
    ov.innerHTML=`<div class="card"><h1>🏆 1º lugar!</h1><p>Pontos: ${pontosFinais}</p><p>Digite seu nome:</p><input id="nm" maxlength="16" autofocus><br><button id="ok">Salvar</button></div>`;
    const i=document.getElementById("nm");i.focus();
    const ok=()=>salvarNome(i.value);
    document.getElementById("ok").onclick=ok;
    i.onkeydown=e=>{e.stopPropagation();if(e.key==="Enter")ok()};
  }else mostrarFim();
}
function salvarNome(v){
  const nome=v.trim().slice(0,16)||"Anônimo";
  const l=rank();l.push({nome,pontos:pontosFinais,dif});l.sort((a,b)=>b.pontos-a.pontos);
  try{localStorage.setItem("corrida_rank",JSON.stringify(l.slice(0,20)))}catch(e){}
  aviso=l[0].nome===nome&&l[0].pontos===pontosFinais?`🏆 ${nome} é o TOP 1 do ranking!`:`${nome} entrou no ranking.`;
  mostrarFim();
}
function mostrarFim(){
  estado="fim";
  ov.innerHTML=`<div class="card"><h1>${posFinal}º lugar</h1><p>Pontos: ${pontosFinais}</p><p>${aviso.replace(/</g,"&lt;")}</p><p><b>Ranking</b></p>${textoRank()}<button id="m">Voltar ao menu</button></div>`;
  document.getElementById("m").onclick=menu;
}
function menu(){
  estado="menu";carros=[];
  ov.innerHTML=`<div class="card"><h1>🏁 Corrida</h1><p>Escolha a dificuldade:</p>
  <button data-d="facil">Fácil</button><button data-d="medio">Médio</button><button data-d="dificil">Difícil</button>
  <p>W acelera · S freia · A/D lados (ou setas) · Q menu</p><p><b>Ranking</b></p>${textoRank()}</div>`;
  ov.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>iniciar(b.dataset.d));
}

// ---------- desenho ----------
function pista(){
  g.fillStyle="#005f00";g.fillRect(0,0,900,560);
  g.beginPath();g.ellipse(CX,CY,RX,RY,0,0,Math.PI*2);
  g.strokeStyle="#585858";g.lineWidth=180;g.stroke();
  g.strokeStyle="#ddd";g.lineWidth=2;g.setLineDash([14,14]);g.stroke();g.setLineDash([]);
  for(let i=0;i<8;i++){g.fillStyle=i%2?"#fff":"#111";g.fillRect(CX+RX-90+i*22.5,CY-8,22.5,8);g.fillStyle=i%2?"#111":"#fff";g.fillRect(CX+RX-90+i*22.5,CY,22.5,8)}
}
function carro(c){
  const{x,y}=coord(c),a=c.prog/L*Math.PI*2;
  const dx=-(RX+c.lat)*Math.sin(a),dy=(RY+c.lat)*Math.cos(a),s=5;
  g.save();g.translate(x,y);g.rotate(Math.atan2(dy,dx));
  for(let r=0;r<4;r++)for(let k=0;k<6;k++){const p=SPR[r][k];if(p===".")continue;
    g.fillStyle=p==="B"?COR[c.id]:PX[p];g.fillRect((k-3)*s,(r-2)*s,s+.5,s+.5)}
  g.restore();
}
function desenhar(){
  pista();
  if(estado==="menu"){return}
  for(const c of [...carros].sort((a,b)=>a.humano-b.humano))carro(c);
  const eu=carros[6],volta=Math.min(VOLTAS,Math.max(1,Math.floor(eu.prog/L)+1));
  g.fillStyle="#000b";g.fillRect(0,0,900,48);
  g.fillStyle="#fff";g.font="bold 15px system-ui,sans-serif";
  g.fillText(`Posição: ${posDe(eu)}º/8   Volta: ${volta}/${VOLTAS}   Pontos: ${pontosAtuais()}   Tempo: ${tempo.toFixed(1)}s (${NOMES[dif]})`,12,20);
  g.font="12px system-ui,sans-serif";
  g.fillText(posicoes().map((c,i)=>`${i+1}.${c.humano?"VOCÊ":c.nome.replace("Carro ","C")}`).join("  "),12,39);
  if(msgT>0){g.fillStyle="#ff6b5b";g.font="bold 18px system-ui,sans-serif";g.fillText(msg,12,76)}
}

// ---------- entrada ----------
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.target.tagName==="INPUT")return;
  if(k.startsWith("arrow")||k===" ")e.preventDefault();
  keys[k]=true;
  if(k==="q"&&estado!=="nome")menu();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
document.querySelectorAll("#tc button").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
  ["pointerup","pointerleave","pointercancel"].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
});

// ---------- loop ----------
let ult=performance.now();
function loop(n){
  const dt=Math.min(0.05,(n-ult)/1000);ult=n;
  if(estado==="corrida")atualizar(dt);
  desenhar();requestAnimationFrame(loop);
}
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
